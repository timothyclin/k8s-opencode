apiVersion: v1
kind: Pod
metadata:
  name: image-copier
  namespace: registry
spec:
  restartPolicy: Never
  containers:
  - name: copier
    image: quay.io/skopeo/stable:latest
    command:
    - sh
    - -c
    args:
    - |
      echo "Copying image from Tailscale to local registry..."
      skopeo copy docker://registry.lynx-beta.ts.net/operator:0.3.3 docker://localhost:5000/operator:0.3.3
      echo "Done"