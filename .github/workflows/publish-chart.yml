name: publish-chart

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update Chart.yaml version
        run: |
          cd chart
          yq -i ".version = \"${{ steps.version.outputs.VERSION }}\"" Chart.yaml
          yq -i ".appVersion = \"${{ steps.version.outputs.VERSION }}\"" Chart.yaml

      - name: Commit version update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update chart version to ${{ steps.version.outputs.VERSION }}"
          file_pattern: chart/Chart.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Log in to GHCR
        env:
          HELM_REGISTRY: ghcr.io
          HELM_USERNAME: ${{ github.actor }}
          HELM_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$HELM_PASSWORD" | helm registry login "$HELM_REGISTRY" --username "$HELM_USERNAME" --password-stdin

      - name: Package chart
        run: helm package chart/

      - name: Push chart
        run: helm push ok8s-*.tgz oci://ghcr.io/timothyclin/k8s-opencode/chart/ok8s
