name: publish-chart

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install yq
        uses: mikefarah/yq@v4
        with:
          version: v4.35.2

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Update version files
        run: |
          # Update Chart.yaml
          yq -i ".version = \"${{ steps.version.outputs.VERSION }}\"" chart/Chart.yaml
          yq -i ".appVersion = \"${{ steps.version.outputs.VERSION }}\"" chart/Chart.yaml
          # Update image tags in values.yaml so the packaged chart references the correct image version
          yq -i ".image.tag = \"${{ steps.version.outputs.VERSION }}\"" chart/values.yaml
          yq -i ".auth.router.image.tag = \"${{ steps.version.outputs.VERSION }}\"" chart/values.yaml

      - name: Create version bump PR
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create branch
          git checkout -b "release/bump-${VERSION}"
          
          # Commit changes
          git add chart/Chart.yaml chart/values.yaml
          git commit -m "chore: bump chart version to ${VERSION}" || echo "No changes to commit"
          
          # Push and create PR with full options
          git push -u origin "release/bump-${VERSION}" -f
          # Create PR only if it doesn't exist
          if ! gh pr list --base main --head "release/bump-${VERSION}" --repo "${{ github.repository }}" | grep -q .; then
            gh pr create --base main --head "release/bump-${VERSION}" \
              --title "chore: release v${VERSION}" \
              --body "Automated release: bump chart and image versions to ${VERSION}" \
              --repo "${{ github.repository }}"
          fi
          echo "PR creation attempted"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Log in to GHCR
        env:
          HELM_REGISTRY: ghcr.io
          HELM_USERNAME: ${{ github.actor }}
          HELM_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$HELM_PASSWORD" | helm registry login "$HELM_REGISTRY" --username "$HELM_USERNAME" --password-stdin

      - name: Package chart
        run: helm package chart/

      - name: Push chart
        run: helm push ok8s-*.tgz oci://ghcr.io/timothyclin/k8s-opencode/chart
