name: publish-chart

on:
  push:
    tags:
      - "v*"

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version files
        run: |
          # Update Chart.yaml
          yq -i ".version = \"${{ steps.version.outputs.VERSION }}\"" chart/Chart.yaml
          yq -i ".appVersion = \"${{ steps.version.outputs.VERSION }}\"" chart/Chart.yaml
          # Update image tags in values.yaml so the packaged chart references the correct image version
          yq -i ".image.tag = \"${{ steps.version.outputs.VERSION }}\"" chart/values.yaml
          yq -i ".auth.router.image.tag = \"${{ steps.version.outputs.VERSION }}\"" chart/values.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Log in to GHCR
        env:
          HELM_REGISTRY: ghcr.io
          HELM_USERNAME: ${{ github.actor }}
          HELM_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$HELM_PASSWORD" | helm registry login "$HELM_REGISTRY" --username "$HELM_USERNAME" --password-stdin

      - name: Package chart
        run: helm package chart/

      - name: Push chart
        run: helm push ok8s-*.tgz oci://ghcr.io/timothyclin/k8s-opencode/chart
