name: publish-chart

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Log in to GHCR
        env:
          HELM_REGISTRY: ghcr.io
          HELM_USERNAME: ${{ github.actor }}
          HELM_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$HELM_PASSWORD" | helm registry login "$HELM_REGISTRY" --username "$HELM_USERNAME" --password-stdin

      - name: Package chart
        run: helm package chart/

      - name: Push chart
        run: helm push ok8s-*.tgz oci://ghcr.io/timothyclin/k8s-opencode/chart

      - name: Verify chart is fetchable
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/v//')
          echo "Verifying chart version $VERSION is fetchable..."
          helm pull oci://ghcr.io/timothyclin/k8s-opencode/chart/ok8s --version $VERSION --untar-only --untar-dir verify-test || exit 1
          rm -rf verify-test
          echo "Chart verified successfully"
