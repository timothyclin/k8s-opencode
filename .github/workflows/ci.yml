name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Always runs - validate all YAML files
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint YAML files
        run: |
          for f in $(find . -name "*.yml" -o -name "*.yaml"); do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null || echo "Invalid: $f"
          done

      - name: Check for uncommitted generated files
        run: |
          if [ -d operator/config ] && [ -d operator/config/crd ]; then
            git diff --name-only operator/config/crd/bases/ 2>/dev/null || true
          fi

  # Runs only when chart files change
  chart:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.title, '') ||
      contains(github.event.head_commit.message, '') ||
      contains(join(inputs.files), 'chart/') ||
      contains(join(inputs.files), 'Chart.yaml') ||
      github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint chart
        run: helm lint chart/

      - name: Template chart
        run: helm template test chart/ -n opencode

  # Runs only when operator files change
  operator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    if: |
      contains(github.event.pull_request.title, '') ||
      contains(github.event.head_commit.message, '') ||
      contains(join(inputs.files), 'operator/') ||
      github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect operator changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            if git diff --name-only "$BASE" "$HEAD" | grep -q '^operator/'; then
              echo "run=true" >> $GITHUB_OUTPUT
            else
              echo "run=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up Go
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Verify manifests
        if: steps.changes.outputs.run == 'true'
        run: |
          make manifests generate
          if ! git diff --quiet; then
            echo "ERROR: Generated files are out of date. Run 'make manifests generate' and commit."
            git diff
            exit 1
          fi

      - name: Lint
        if: steps.changes.outputs.run == 'true'
        run: make lint

      - name: Test
        if: steps.changes.outputs.run == 'true'
        run: make test
