{{- if and (eq .Values.mode "single") (eq .Values.secrets.backend "plain") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencode-k8s-helm.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencode-k8s-helm.labels" . | nindent 4 }}
type: Opaque
stringData:
  server-password: {{ .Values.serverPassword | quote }}
  {{- if .Values.providers.anthropic.enabled }}
  anthropic-api-key: {{ .Values.providers.anthropic.apiKey | quote }}
  {{- end }}
  {{- if .Values.providers.openai.enabled }}
  openai-api-key: {{ .Values.providers.openai.apiKey | quote }}
  {{- end }}
  {{- if .Values.providers.google.enabled }}
  gemini-api-key: {{ .Values.providers.google.apiKey | quote }}
  {{- end }}
{{- end }}
