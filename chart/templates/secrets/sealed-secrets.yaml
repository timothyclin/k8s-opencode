{{- if and (eq .Values.mode "single") (eq .Values.secrets.backend "sealed") }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "k8s-omo.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-omo.labels" . | nindent 4 }}
spec:
  encryptedData:
    # -- Replace these with encrypted values generated by kubeseal
    # kubeseal --cert <cert> --raw --from-file=password.txt --namespace <ns> --name <name>
    server-password: "AgB...encrypted-value..."
    {{- if .Values.providers.anthropic.enabled }}
    anthropic-api-key: "AgB...encrypted-value..."
    {{- end }}
    {{- if .Values.providers.openai.enabled }}
    openai-api-key: "AgB...encrypted-value..."
    {{- end }}
    {{- if .Values.providers.google.enabled }}
    gemini-api-key: "AgB...encrypted-value..."
    {{- end }}
  template:
    metadata:
      name: {{ include "k8s-omo.fullname" . }}-secrets
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
