{{- if and (eq .Values.mode "single") (eq .Values.secrets.backend "external") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ok8s.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ok8s.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.externalSecretStore | default "default" }}
    kind: SecretStore
  target:
    name: {{ include "ok8s.fullname" . }}-secrets
    creationPolicy: Owner
  data:
  - secretKey: server-password
    remoteRef:
      key: opencode
      property: server-password
  {{- if .Values.providers.anthropic.enabled }}
  - secretKey: anthropic-api-key
    remoteRef:
      key: opencode
      property: anthropic-api-key
  {{- end }}
  {{- if .Values.providers.openai.enabled }}
  - secretKey: openai-api-key
    remoteRef:
      key: opencode
      property: openai-api-key
  {{- end }}
  {{- if .Values.providers.google.enabled }}
  - secretKey: gemini-api-key
    remoteRef:
      key: opencode
      property: gemini-api-key
  {{- end }}
{{- end }}
