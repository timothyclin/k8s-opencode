apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-sa
  namespace: registry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-role
  namespace: registry
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-rolebinding
  namespace: registry
subjects:
- kind: ServiceAccount
  name: registry-sa
  namespace: registry
roleRef:
  kind: Role
  name: registry-role
  apiGroup: rbac.authorization.k8s.io