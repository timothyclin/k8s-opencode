{{- if and (eq .Values.mode "multi") .Values.auth.oidc.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-omo.fullname" . }}-router
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-omo.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events {}
    http {
      map $http_host $upstream_name {
        default "";
        {{- range $index, $user := .Values.users }}
        ~^opencode-{{ $user.name }}-{{ $.Release.Namespace }}(\..*)?$ {{ include "k8s-omo.fullname" $ }}-user-{{ $user.name }};
        {{- end }}
      }

      server {
        listen 8080;

        location / {
          if ($upstream_name = "") { return 404; }
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_pass http://$upstream_name:4096;
        }
      }
    }
{{- end }}
