{{- if and (eq .Values.mode "multi") .Values.auth.oidc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode-k8s-helm.fullname" . }}-router
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencode-k8s-helm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opencode-router
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
{{- end }}
