{{- if and (eq .Values.mode "multi") .Values.auth.oidc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ok8s.fullname" . }}-auth-router
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ok8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-router
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: auth-router
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
