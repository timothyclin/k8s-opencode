{{- if and (eq .Values.mode "multi") .Values.auth.oidc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-omo.fullname" . }}-router
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-omo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode-router
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode-router
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - name: router
        image: nginx:1.27
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: {{ include "k8s-omo.fullname" . }}-router
{{- end }}
