{{- if and (eq .Values.mode "single") .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opencode-k8s-helm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencode-k8s-helm.labels" . | nindent 4 }}
  annotations:
    tailscale.com/hostname: {{ .Values.ingress.hostname | quote }}
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ include "opencode-k8s-helm.fullname" . }}
      port:
        number: 4096
  tls:
    - hosts:
        - {{ .Values.ingress.hostname }}
{{- end }}
