{{- if and .Values.identity.enabled .Values.identity.files }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opencode-k8s-helm.fullname" . }}-identity
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencode-k8s-helm.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.identity.files }}
  {{ $key }}: |
    {{- $value | nindent 4 }}
  {{- end }}
{{- end }}
