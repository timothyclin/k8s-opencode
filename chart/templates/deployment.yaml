              [ -f "$f" ] || continue
              filename=$(basename "$f")
              target="/home/{{ $username }}/.config/opencode/$filename"
              # Copy if target doesn't exist OR if source is newer
              if [ ! -e "$target" ] || [ "$f" -nt "$target" ]; then
                cp "$f" "$target"
              fi
            done
          fi
