{{- if eq .Values.mode "single" }}
{{- $username := .Values.opencode.username | default "opencode" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ok8s.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ok8s.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ok8s.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ok8s.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include "ok8s.opencodeConfig" . | sha256sum }}
        {{- if .Values.omo.enabled }}
        checksum/omo: {{ include "ok8s.omoConfig" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: init-config
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - sh
        - -c
        - |
          set -e
          USER_NAME="{{ $username }}"
          USER_ID="{{ .Values.securityContext.runAsUser | default 1000 }}"
          USER_GID="{{ .Values.securityContext.runAsGroup | default 1000 }}"
          
          # Create user with provided name (or fallback)
          id "$USER_NAME" 2>/dev/null || useradd -u $USER_ID -g $USER_GID -m -d /home/$USER_NAME -s /bin/bash "$USER_NAME"
          
          # Configure sudoers for the runtime user
          echo "$USER_NAME ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/$USER_NAME
          chmod 440 /etc/sudoers.d/$USER_NAME
          
          # Build /etc/passwd with dynamic user entry for whoami support
          cp /etc/passwd /mnt/passwd/passwd
          
          mkdir -p /home/$USER_NAME/.config/opencode
          # Copy config from ConfigMap to opencode subdirectory
          if [ -d /tmp/config-source ] && [ "$(ls -A /tmp/config-source 2>/dev/null)" ]; then
            for f in /tmp/config-source/*; do
              [ -f "$f" ] || continue
              filename=$(basename "$f")
              target="/home/$USER_NAME/.config/opencode/$filename"
              # Copy if target doesn't exist OR if source is newer
              if [ ! -e "$target" ] || [ "$f" -nt "$target" ]; then
                cp "$f" "$target"
              fi
            done
          fi
          # Copy omo config if present
          if [ -d /tmp/omo-source ] && [ "$(ls -A /tmp/omo-source 2>/dev/null)" ]; then
            mkdir -p /home/$USER_NAME/.config/opencode
            for f in /tmp/omo-source/*; do
              [ -f "$f" ] || continue
              filename=$(basename "$f")
              target="/home/$USER_NAME/.config/opencode/$filename"
              if [ ! -e "$target" ] || [ "$f" -nt "$target" ]; then
                cp "$f" "$target"
              fi
            done
          fi
          # Seed skills: copy from ConfigMap to PVC only if not already present (preserves user edits)
          if [ -d /tmp/skills-source ] && [ "$(ls -A /tmp/skills-source 2>/dev/null)" ]; then
            mkdir -p /home/$USER_NAME/.config/opencode/skills
            for f in /tmp/skills-source/*; do
              [ -f "$f" ] || continue
              skill_name=$(basename "$f")
              skill_dir="/home/$USER_NAME/.config/opencode/skills/$skill_name"
              skill_file="$skill_dir/SKILL.md"
              if [ ! -e "$skill_file" ]; then
                mkdir -p "$skill_dir"
                cp "$f" "$skill_file"
              fi
            done
          fi
          # Best-effort chown (NFS with root_squash may fail)
          chown -R $USER_ID:$USER_GID /home/$USER_NAME 2>/dev/null || true
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          {{- if .Values.securityContext.enabled }}
          runAsNonRoot: false
          {{- end }}
        volumeMounts:
        - name: data
          mountPath: /home/{{ $username }}
        - name: config-init
          mountPath: /tmp/config-source
          readOnly: true
        - name: omo-init
          mountPath: /tmp/omo-source
          readOnly: true
        - name: sudoers
          mountPath: /etc/sudoers.d/
        - name: passwd
          mountPath: /mnt/passwd
        - name: skills-init
          mountPath: /tmp/skills-source
          readOnly: true
      {{- if .Values.identity.enabled }}
      - name: init-identity
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - sh
        - -c
        - |
          set -e
          if [ -d /identity ]; then
            for f in /identity/*; do
              filename=$(basename "$f")
              target="/home/{{ $username }}/$filename"
              if [ ! -e "$target" ]; then
                cp -r "$f" "$target"
                chown -R 1000:1000 "$target"
              fi
            done
          fi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: identity
          mountPath: /identity
          readOnly: true
        - name: data
          mountPath: /home/{{ $username }}
      {{- end }}
      containers:
      - name: opencode
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
        workingDir: /home/{{ $username }}
        ports:
        - containerPort: 4096
          name: http
          protocol: TCP
        env:
        - name: HOME
          value: "/home/{{ $username }}"
        - name: OPENCODE_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "ok8s.fullname" . }}-secrets
              key: server-password
        {{- if .Values.providers.anthropic.enabled }}
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "ok8s.fullname" . }}-secrets
              key: anthropic-api-key
        {{- end }}
        {{- if .Values.providers.openai.enabled }}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "ok8s.fullname" . }}-secrets
              key: openai-api-key
        {{- end }}
        {{- if .Values.providers.google.enabled }}
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "ok8s.fullname" . }}-secrets
              key: gemini-api-key
        {{- end }}
        - name: OPENCODE_ENABLE_EXA
          value: "1"
        {{- if .Values.kubedock.enabled }}
        - name: DOCKER_HOST
          value: "tcp://{{ include "ok8s.fullname" . }}-kubedock-service:{{ .Values.kubedock.port }}"
        - name: TESTCONTAINERS_RYUK_DISABLED
          value: "true"
        - name: TESTCONTAINERS_CHECKS_DISABLE
          value: "true"
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /home/{{ $username }}
        - name: workspace
          mountPath: /home/{{ $username }}/workspace
        - name: sudoers
          mountPath: /etc/sudoers.d/
          readOnly: true
        - name: passwd
          mountPath: /etc/passwd
          subPath: passwd
          readOnly: true
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        readinessProbe:
          tcpSocket:
            port: 4096
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 4096
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: data
        {{- if .Values.persistence.data.emptyDir }}
        emptyDir: {}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "ok8s.fullname" . }}-data
        {{- end }}
      - name: workspace
        {{- if .Values.persistence.workspace.emptyDir }}
        emptyDir: {}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "ok8s.fullname" . }}-workspace
        {{- end }}
      - name: config-init
        configMap:
          name: {{ include "ok8s.fullname" . }}-config
      - name: omo-init
        configMap:
          name: {{ include "ok8s.fullname" . }}-omo
          optional: true
      - name: skills-init
        configMap:
          name: {{ include "ok8s.fullname" . }}-skills
          optional: true
      {{- if .Values.identity.enabled }}
      - name: identity
        configMap:
          name: {{ include "ok8s.fullname" . }}-identity
      {{- end }}
      - name: sudoers
        emptyDir: {}
      - name: passwd
        emptyDir: {}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
