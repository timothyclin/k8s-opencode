{{- if eq .Values.mode "single" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "k8s-omo.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-omo.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode }}
  {{- if .Values.persistence.data.storageClass }}
  storageClassName: {{ .Values.persistence.data.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "k8s-omo.fullname" . }}-workspace
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-omo.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.workspace.accessMode }}
  {{- if .Values.persistence.workspace.storageClass }}
  storageClassName: {{ .Values.persistence.workspace.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.workspace.size }}
{{- end }}
