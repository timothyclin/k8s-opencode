{{- if eq .Values.mode "multi" }}
{{- $root := . }}
{{- range $index, $user := .Values.users }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opencode-k8s-helm.fullname" $root }}-user-{{ $user.name }}-config
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "opencode-k8s-helm.labels" $root | nindent 4 }}
    app.kubernetes.io/user: {{ $user.name | quote }}
data:
  opencode.jsonc: |
    {{- include "opencode-k8s-helm.opencodeUserConfig" (dict "root" $root "user" $user) | nindent 4 }}
  oh-my-opencode.jsonc: |
    {{- include "opencode-k8s-helm.omoUserConfig" (dict "root" $root "user" $user) | nindent 4 }}
{{- end }}
{{- end }}
