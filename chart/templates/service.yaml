{{- if eq .Values.mode "single" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ok8s.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ok8s.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ok8s.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
  - name: http
    port: 4096
    targetPort: 4096
    protocol: TCP
{{- end }}
{{- if eq .Values.mode "multi" }}
{{- $root := . }}
{{- range $index, $user := .Values.users }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ok8s.fullname" $root }}-user-{{ $user.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "ok8s.labels" $root | nindent 4 }}
    app.kubernetes.io/user: {{ $user.name | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "ok8s.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/user: {{ $user.name | quote }}
  ports:
  - name: http
    port: 4096
    targetPort: 4096
    protocol: TCP
{{- end }}
{{- end }}
