{{- if .Values.kubedock.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ok8s.fullname" . }}-kubedock
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ok8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubedock
subjects:
- kind: ServiceAccount
  name: {{ include "ok8s.fullname" . }}-kubedock
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "ok8s.fullname" . }}-kubedock
  apiGroup: rbac.authorization.k8s.io
{{- end }}
