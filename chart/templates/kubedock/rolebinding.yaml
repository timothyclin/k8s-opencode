{{- if .Values.kubedock.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opencode-k8s-helm.fullname" . }}-kubedock
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencode-k8s-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubedock
subjects:
- kind: ServiceAccount
  name: {{ include "opencode-k8s-helm.fullname" . }}-kubedock
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "opencode-k8s-helm.fullname" . }}-kubedock
  apiGroup: rbac.authorization.k8s.io
{{- end }}
