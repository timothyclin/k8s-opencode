{{- /*
Single-user mode: shared kubedock Service.
*/ -}}
{{- if and .Values.kubedock.enabled (eq .Values.mode "single") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode-k8s-helm.fullname" . }}-kubedock-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencode-k8s-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubedock
spec:
  type: ClusterIP
  selector:
    {{- include "opencode-k8s-helm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kubedock
  ports:
  - protocol: TCP
    port: {{ .Values.kubedock.port }}
    targetPort: {{ .Values.kubedock.port }}
    name: api
{{- end }}
