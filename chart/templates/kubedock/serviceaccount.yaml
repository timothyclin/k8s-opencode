{{- if .Values.kubedock.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opencode-k8s-helm.fullname" . }}-kubedock
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencode-k8s-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubedock
{{- end }}
