{{- if .Values.authentik.enabled }}
# Authentik ingress for shared hostname
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ok8s.fullname" . }}-authentik
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - {{ .Values.authentik.proxy.hostname }}
    secretName: {{ include "ok8s.fullname" . }}-authentik-tls
  rules:
  - host: {{ .Values.authentik.proxy.hostname | default "opencode.company.com" }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "ok8s.fullname" . }}-authentik
            port:
              number: 80
{{- else }}
# Original ingress logic for direct routing to OpenCode
{{- if and (eq .Values.mode "single") .Values.ingress.enabled }}
{{- $hostname := .Values.ingress.hostname | default (include "ok8s.ingressHostname" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ok8s.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ok8s.labels" . | nindent 4 }}
  annotations:
    tailscale.com/hostname: {{ $hostname | quote }}
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ include "ok8s.fullname" . }}
      port:
        number: 4096
  tls:
    - hosts:
        - {{ $hostname }}
{{- end }}
{{- end }}