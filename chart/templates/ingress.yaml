{{- if .Values.authentik.enabled }}
# Authentik ingress for shared hostname
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ok8s.fullname" . }}-authentik
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - {{ .Values.authentik.proxy.hostname }}
    secretName: {{ include "ok8s.fullname" . }}-authentik-tls
  rules:
  - host: {{ .Values.authentik.proxy.hostname }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "ok8s.fullname" . }}-authentik
            port:
              number: 80
{{- else }}
# Original ingress logic here
{{- if .Values.auth.oidc.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ok8s.fullname" . }}-oidc
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - {{ .Values.auth.oidc.hostname }}
    secretName: {{ include "ok8s.fullname" . }}-oidc-tls
  rules:
  - host: {{ .Values.auth.oidc.hostname }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "ok8s.fullname" . }}-auth-router
            port:
              number: 8080
{{- end }}
{{- end }}