{{- if eq .Values.mode "multi" }}
{{- $root := . }}
{{- range $index, $user := .Values.users }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ok8s.fullname" $root }}-{{ $user.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "ok8s.labels" $root | nindent 4 }}
    app.kubernetes.io/user: {{ $user.name | quote }}
spec:
  serviceName: {{ include "ok8s.fullname" $root }}-user-{{ $user.name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ok8s.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/user: {{ $user.name | quote }}
  updateStrategy:
    type: {{ $root.Values.updateStrategy.type }}
    {{- if eq $root.Values.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      partition: {{ $root.Values.updateStrategy.rollingUpdate.partition }}
      maxUnavailable: {{ $root.Values.updateStrategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "ok8s.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/user: {{ $user.name | quote }}
      annotations:
        checksum/config: {{ include "ok8s.userConfigChecksum" (dict "root" $root "user" $user) | sha256sum }}
        {{- with $root.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if $root.Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ $root.Values.securityContext.runAsNonRoot }}
        runAsUser: {{ $root.Values.securityContext.runAsUser }}
        runAsGroup: {{ $root.Values.securityContext.runAsGroup }}
        fsGroup: {{ $root.Values.securityContext.fsGroup }}
      {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Always run init container to fix PVC permissions (runs as root)
      initContainers:
      - name: init-permissions
        image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
        imagePullPolicy: {{ $root.Values.image.pullPolicy }}
        command:
        - sh
        - -c
        - |
          set -e
          USER_NAME="{{ $user.name }}"
          USER_ID="{{ $root.Values.securityContext.runAsUser | default 1000 }}"
          USER_GID="{{ $root.Values.securityContext.runAsGroup | default 1000 }}"
          
          # Create user with provided name
          id "$USER_NAME" 2>/dev/null || useradd -u $USER_ID -g $USER_GID -m -d /home/$USER_NAME -s /bin/bash "$USER_NAME"
          
          # Configure sudoers for the runtime user
          echo "$USER_NAME ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/$USER_NAME
          chmod 440 /etc/sudoers.d/$USER_NAME
          
          # Build /etc/passwd with dynamic user entry for whoami support
          cp /etc/passwd /mnt/passwd/passwd

          # Fix ownership on all mounted directories
          chown -R $USER_ID:$USER_GID /home/$USER_NAME/workspace /home/$USER_NAME/.local /home/$USER_NAME/.config 2>/dev/null || true
          # Create user subdirectory if it doesn't exist (main app needs it)
          mkdir -p /home/$USER_NAME/.config/opencode 2>/dev/null || true
          chown -R $USER_ID:$USER_GID /home/$USER_NAME/.config/opencode 2>/dev/null || true
          # Copy config files from ConfigMap to PVC (ConfigMap is read-only, need to copy to writable PVC)
          if [ -f /etc/opencode-config/opencode.jsonc ]; then
            cp /etc/opencode-config/opencode.jsonc /home/$USER_NAME/.config/opencode/
            chown $USER_ID:$USER_GID /home/$USER_NAME/.config/opencode/opencode.jsonc
          fi
          if [ -f /etc/opencode-config/oh-my-opencode.jsonc ]; then
            cp /etc/opencode-config/oh-my-opencode.jsonc /home/$USER_NAME/.config/opencode/
            chown $USER_ID:$USER_GID /home/$USER_NAME/.config/opencode/oh-my-opencode.jsonc
          fi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          {{- if $root.Values.securityContext.enabled }}
          runAsNonRoot: false
          {{- end }}
        volumeMounts:
        - name: config-src
          mountPath: /etc/opencode-config
          readOnly: true
        - name: home-dir
          mountPath: /home/{{ $user.name }}
        - name: workspace
          mountPath: /home/{{ $user.name }}/workspace
        - name: data
          mountPath: /home/{{ $user.name }}/.local
        - name: config
          mountPath: /home/{{ $user.name }}/.config
        - name: sudoers
          mountPath: /etc/sudoers.d/
        - name: passwd
          mountPath: /mnt/passwd
      {{- if $root.Values.identity.enabled }}
      - name: init-identity
        image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
        imagePullPolicy: {{ $root.Values.image.pullPolicy }}
        command:
        - sh
        - -c
        - |
          set -e
          # Ensure workspace directory exists and has correct permissions
          if [ -d /home/{{ $user.name }}/workspace ]; then
            chown -R {{ $root.Values.securityContext.runAsUser }}:{{ $root.Values.securityContext.runAsGroup }} /home/{{ $user.name }}/workspace
          fi
          # Copy identity files if present
          if [ -d /identity ]; then
            for f in /identity/*; do
              filename=$(basename "$f")
              target="/home/{{ $user.name }}/$filename"
              if [ ! -e "$target" ]; then
                cp -r "$f" "$target"
                chown -R {{ $root.Values.securityContext.runAsUser }}:{{ $root.Values.securityContext.runAsGroup }} "$target"
              fi
            done
          fi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: config-src
          mountPath: /etc/opencode-config
          readOnly: true
        - name: identity
          mountPath: /identity
          readOnly: true
        - name: home-dir
          mountPath: /home/{{ $user.name }}
        - name: workspace
          mountPath: /home/{{ $user.name }}/workspace
        - name: data
          mountPath: /home/{{ $user.name }}/.local
        - name: config
          mountPath: /home/{{ $user.name }}/.config
      {{- end }}
      containers:
      - name: opencode
        image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
        imagePullPolicy: {{ $root.Values.image.pullPolicy }}
        command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
        workingDir: /home/{{ $user.name }}
        ports:
        - containerPort: 4096
          name: http
          protocol: TCP
        env:
        - name: HOME
          value: "/home/{{ $user.name }}"
        - name: OPENCODE_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "ok8s.fullname" $root }}-user-{{ $user.name }}-secrets
              key: server-password
        {{- if and $user.providers $user.providers.anthropic $user.providers.anthropic.enabled }}
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "ok8s.fullname" $root }}-user-{{ $user.name }}-secrets
              key: anthropic-api-key
        {{- end }}
        {{- if and $user.providers $user.providers.openai $user.providers.openai.enabled }}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "ok8s.fullname" $root }}-user-{{ $user.name }}-secrets
              key: openai-api-key
        {{- end }}
        {{- if and $user.providers $user.providers.google $user.providers.google.enabled }}
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "ok8s.fullname" $root }}-user-{{ $user.name }}-secrets
              key: gemini-api-key
        {{- end }}
        - name: OPENCODE_ENABLE_EXA
          value: "1"
        {{- if $root.Values.kubedock.enabled }}
        - name: DOCKER_HOST
          value: "tcp://{{ include "ok8s.fullname" $root }}-kubedock-{{ $user.name }}:{{ $root.Values.kubedock.port }}"
        - name: TESTCONTAINERS_RYUK_DISABLED
          value: "true"
        - name: TESTCONTAINERS_CHECKS_DISABLE
          value: "true"
        {{- end }}
        {{- with $root.Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: home-dir
          mountPath: /home/{{ $user.name }}
        - name: config
          mountPath: /home/{{ $user.name }}/.config
          subPath: opencode
        - name: data
          mountPath: /home/{{ $user.name }}/.local
        - name: workspace
          mountPath: /home/{{ $user.name }}/workspace
        - name: sudoers
          mountPath: /etc/sudoers.d
          readOnly: true
        - name: passwd
          mountPath: /etc/passwd
          subPath: passwd
          readOnly: true
        {{- with $root.Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        readinessProbe:
          tcpSocket:
            port: 4096
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 4096
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        resources:
          {{- toYaml (default $root.Values.resources $user.resources) | nindent 10 }}
      volumes:
      - name: config-src
        configMap:
          name: {{ include "ok8s.fullname" $root }}-user-{{ $user.name }}-config
      - name: config
        emptyDir: {}
      - name: home-dir
        emptyDir: {}
      - name: sudoers
        emptyDir: {}
      - name: passwd
        emptyDir: {}
      {{- if $root.Values.identity.enabled }}
      - name: identity
        configMap:
          name: {{ include "ok8s.fullname" $root }}-identity
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        {{- include "ok8s.labels" $root | nindent 8 }}
        app.kubernetes.io/user: {{ $user.name | quote }}
    spec:
      accessModes:
        - {{ $root.Values.persistence.data.accessMode }}
      {{- if $root.Values.persistence.data.storageClass }}
      storageClassName: {{ $root.Values.persistence.data.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ $root.Values.persistence.data.size }}
  - metadata:
      name: workspace
      labels:
        {{- include "ok8s.labels" $root | nindent 8 }}
        app.kubernetes.io/user: {{ $user.name | quote }}
    spec:
      accessModes:
        - {{ $root.Values.persistence.workspace.accessMode }}
      {{- if $root.Values.persistence.workspace.storageClass }}
      storageClassName: {{ $root.Values.persistence.workspace.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ $user.workspaceSize | default $root.Values.persistence.workspace.size }}
{{- end }}
{{- end }}
