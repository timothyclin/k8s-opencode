{{- if .Values.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "ok8s.fullname" . }}-quota
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ok8s.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.resourceQuota.maxCpu | quote }}
    requests.memory: {{ .Values.resourceQuota.maxMemory | quote }}
    persistentvolumeclaims: {{ .Values.resourceQuota.maxPvcCount | quote }}
{{- end }}
