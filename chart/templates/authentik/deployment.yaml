{{- if .Values.authentik.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ok8s.fullname" . }}-authentik
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ok8s.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.authentik.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - name: authentik
        image: {{ .Values.authentik.image.repository }}:{{ .Values.authentik.image.tag }}
        imagePullPolicy: {{ .Values.authentik.image.pullPolicy }}
        command: ["ak", "server"]
        ports:
        - containerPort: 9000
          name: http
        - containerPort: 9443
          name: https
        env:
        - name: AUTHENTIK_CONFIG__path
          value: "/etc/authentik/authentik.yml"
        volumeMounts:
        - name: config
          mountPath: /etc/authentik
        - name: secrets
          mountPath: /secrets
        resources:
          {{- toYaml .Values.authentik.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ include "ok8s.fullname" . }}-authentik
      - name: secrets
        secret:
          name: {{ include "ok8s.fullname" . }}-authentik
{{- end }}