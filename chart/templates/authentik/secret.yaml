{{- if .Values.authentik.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ok8s.authentik.fullname" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # Authentik secret key for encryption
  secretKey: {{ required "authentik.secretKey must be set" .Values.authentik.secretKey }}
  # PostgreSQL password
  postgresPassword: {{ .Values.postgresql.auth.password }}
  # Redis password
  redisPassword: {{ .Values.redis.auth.password }}
  # OIDC client secret (if provided)
  {{- if .Values.authentik.oidc.clientSecret }}
  oidcClientSecret: {{ .Values.authentik.oidc.clientSecret }}
  {{- end }}
{{- end }}