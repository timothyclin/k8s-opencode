{{- if .Values.authentik.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ok8s.fullname" . }}-authentik
data:
  # Authentik configuration
  authentik.yml: |
    # Basic configuration
    debug: false
    secret_key: /secrets/secretKey
    disable_startup_analytics: true
    domain: {{ .Values.authentik.domain }}

    # Database
    database:
      host: {{ .Release.Name }}-postgresql
      name: {{ .Values.postgresql.auth.database }}
      user: {{ .Values.postgresql.auth.username }}
      password: /postgres-secrets/postgresql-password

    # Redis
    redis:
      host: {{ .Release.Name }}-redis
      password: /redis-secrets/redis-password

    # Email (disabled for this use case)
    email:
      backend: dummy

    # OIDC provider settings (configured via UI after deployment)
    oidc:
      enabled: {{ .Values.authentik.oidc.enabled }}
      {{- if .Values.authentik.oidc.issuerUrl }}
      issuer_url: {{ .Values.authentik.oidc.issuerUrl }}
      {{- end }}
{{- end }}