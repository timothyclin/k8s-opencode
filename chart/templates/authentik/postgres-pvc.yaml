{{- if and .Values.authentik.enabled .Values.authentik.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ok8s.fullname" . }}-authentik-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.authentik.postgres.persistence.size }}
{{- end }}