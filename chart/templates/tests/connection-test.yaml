{{- if eq .Values.mode "single" }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "opencode-k8s-helm.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencode-k8s-helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
  - name: wget
    image: busybox
    command: ['wget']
    args: [
      '{{ include "opencode-k8s-helm.fullname" . }}:4096/global/health'
    ]
  restartPolicy: Never
{{- end }}
