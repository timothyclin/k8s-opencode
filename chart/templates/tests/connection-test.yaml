{{- if eq .Values.mode "single" }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ok8s.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ok8s.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
  - name: wget
    image: busybox
    command: ['wget']
    args: [
      '{{ include "ok8s.fullname" . }}:4096/global/health'
    ]
  restartPolicy: Never
{{- end }}
