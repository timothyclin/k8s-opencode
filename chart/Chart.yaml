apiVersion: v2
name: ok8s
description: OpenCode + Oh-My-OpenCode on Kubernetes with Tailscale connectivity
type: application
version: 0.3.5
appVersion: "0.3.5"
keywords:
  - opencode
  - ai-coding
  - tailscale
  - mcp
  - oh-my-opencode
home: https://github.com/timothyclin/k8s-opencode
sources:
  - https://github.com/timothyclin/k8s-opencode
maintainers:
  - name: timothyclin
    url: https://github.com/timothyclin
dependencies:
- name: postgresql
  version: "12.x.x"
  repository: "https://charts.bitnami.com/bitnami"
  condition: authentik.postgres.enabled
- name: redis
  version: "17.x.x"
  repository: "https://charts.bitnami.com/bitnami"
  condition: authentik.redis.enabled
