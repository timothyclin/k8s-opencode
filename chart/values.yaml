# -- OpenCode container image
image:
  repository: ghcr.io/timothyclin/k8s-opencode/opencode-workspace
  tag: "0.3.4"
  pullPolicy: IfNotPresent
# -- Create the release namespace (set to false if installing into an existing namespace)
createNamespace: false
# -- Deployment mode: "single" (Deployment) or "multi" (StatefulSet)
mode: "single"
# -- Multi-user configuration (used when mode: "multi")
users: []
# - name: alice
#   email: "alice@example.com"       # Required for OIDC auth — maps Google email to this user
#   password: "change-me"
#   workspaceSize: 20Gi
#   providers:
#     anthropic:
#       enabled: true
#       apiKey: "sk-ant-..."
#     openai:
#       enabled: false
#       apiKey: ""
#     google:
#       enabled: false
#       apiKey: ""
#       projectId: ""
#   mcp:
#     remote: []
#     laptopServers: []
#   resources:
#     requests:
#       cpu: 500m
#       memory: 512Mi
#     limits:
#       cpu: "2"
#       memory: 2Gi
#   skills:
#     npm: []
#     config: []

# -- Shared MCP servers for all users (used when mode: "multi")
sharedMcp: []
# - name: context7
#   url: https://mcp.context7.com/mcp
#   enabled: true
#   headers: {}
#   oauth: {}

# -- Shared skills and rules for all users (used when mode: "multi")
sharedSkills:
  npm: []
  config: []
# -- OAuth2 Proxy OIDC configuration (shared for multi-user mode)
auth:
  oidc:
    enabled: false
    provider: "oidc"
    clientId: ""
    clientSecret: ""
    cookieSecret: ""
    emailDomain: "*"
    # -- Single hostname for OIDC auth (default: oc-ingress)
    # -- Callback URL: https://<hostname>-<namespace>.<tailnet>.ts.net/oauth2/callback
    hostname: "oc-ingress"
    # -- Cookie domain for multi-user OIDC (e.g. ".lynx-beta.ts.net")
    cookieDomain: ""
  # -- Auth router: validates OIDC session and routes to correct user pod
  router:
    image:
      repository: ghcr.io/timothyclin/k8s-opencode/auth-router
      tag: "0.3.4"
      pullPolicy: IfNotPresent
# -- StatefulSet update strategy (used when mode: "multi")
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    partition: 0
    maxUnavailable: 1
# -- Resource quota for multi-user namespaces
resourceQuota:
  enabled: false
  maxCpu: "8"
  maxMemory: 16Gi
  maxPvcCount: 20
# -- Backup settings for maintenance scripts
backup:
  enabled: false
  schedule: "0 3 * * *"
  retention: 7
  storageClass: ""
# -- LLM provider API keys (at least one required)
providers:
  anthropic:
    enabled: false
    apiKey: ""
  openai:
    enabled: false
    apiKey: ""
  google:
    enabled: false
    apiKey: ""
    # -- For Gemini, you may also need a project ID for Vertex AI
    projectId: ""
# -- Server auth (REQUIRED — protects the HTTP endpoint)
# -- If empty, the server will have no authentication
serverPassword: "change-me"
# -- Oh-My-OpenCode configuration
omo:
  enabled: true
  sisyphus:
    maxConcurrentTasks: 2
    taskTimeout: 300
  agents:
    oracle:
      model: "github-copilot/gpt-5.2"
      promptAppend: "Provide concise tradeoffs and a clear recommendation"
    librarian:
      model: "github-copilot/gpt-5-mini"
  categories:
    quick:
      model: "github-copilot/gpt-4.1"
    visualEngineering:
      model: "github-copilot/claude-sonnet-4.6"
# -- MCP server configuration
mcp:
  # -- Remote MCP servers (URLs accessible from the cluster)
  remote:
    - name: context7
      url: https://mcp.context7.com/mcp
      enabled: true
  # - name: sentry
  #   url: https://mcp.sentry.dev/mcp
  #   enabled: false
  #   oauth: {}

  # -- Laptop MCP servers (reachable via Tailscale cluster egress)
  # -- Each entry creates an ExternalName Service + MCP config
  laptopServers: []
  # - name: playwright
  #   tailscaleIP: "100.x.x.x"      # Your laptop's Tailscale IP
  #   # Or use MagicDNS instead of IP:
  #   # tailscaleFqdn: "my-laptop.tail12345.ts.net"
  #   port: 3000
# -- Plugin configuration for OpenCode
# -- Plugins extend OpenCode with additional tools and capabilities
# -- Default plugins: oh-my-opencode (task orchestration), @tarquinen/opencode-dcp (design system),
# --   and superpowers (skills framework with brainstorming, TDD, debugging, code review workflows)
plugins:
  # -- Enable default plugins (set to false to disable all plugins)
  enabled: true
  # -- Additional npm plugins to install (array of npm package specifiers)
  # -- Examples: ["my-plugin@latest", "@scope/plugin@1.0.0"]
  npm:
    - "superpowers@git+https://github.com/obra/superpowers.git"
# -- OpenCode runtime configuration
opencode:
  username: "opencode"
  extraConfig: ""
# -- Skills configuration for OpenCode
# -- Skills are reusable prompt templates and tool configurations
skills:
  # -- npm-based skills to install
  # -- These are user-installed skills that override built-in defaults
  npm: []
  # -- Inline skill configurations (array of skill config objects)
  # -- See https://opencode.ai/docs/skills/ for format
  config: []
# -- Tailscale cluster ingress (exposes OpenCode UI to your tailnet)
ingress:
  enabled: false
  # -- Hostname prefix for MagicDNS (default derives from opencode.username as oc-<username>)
# -- Tailscale operator configuration
# -- If install: true, the chart expects the Tailscale Operator is already installed
# -- This chart does NOT install the operator — install it separately per the README
tailscaleOperator:
  # -- Tag applied to Tailscale proxy nodes for ACL policies
  proxyTag: "tag:k8s"
  # -- Namespace where the Tailscale operator is installed
  namespace: "tailscale"
  cleanupJob:
    image:
      # -- Image for the pre-delete Tailscale cleanup job
      repository: bitnami/kubectl
      tag: latest
      pullPolicy: IfNotPresent
# -- Secret management backend
# -- Options: "plain" (K8s secrets), "sealed" (Bitnami sealed-secrets), "sops" (Mozilla SOPS), "external" (external-secrets-operator)
secrets:
  backend: "plain"
  # -- For sealed-secrets: the certificate secret name
  sealedSecretsCert: ""
  # -- For external-secrets: the SecretStore name
  externalSecretStore: ""
# -- Persistent storage configuration
persistence:
  # -- OpenCode data (config, auth, MCP credentials)
  data:
    storageClass: ""
    size: 5Gi
    accessMode: ReadWriteOnce
  # -- Project workspace files
  workspace:
    storageClass: ""
    size: 20Gi
    accessMode: ReadWriteOnce
# -- Resource requests and limits
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
# -- Pod security context for the OpenCode container
# -- Runs as non-root user (UID 1000) for security best practices
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
# -- Node selector (defaults to arm64)
nodeSelector:
  kubernetes.io/arch: arm64
# -- Tolerations
tolerations: []
# -- Pod annotations
podAnnotations: {}
# -- Additional environment variables
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- Additional volume mounts
extraVolumeMounts: []
# -- Additional volumes
extraVolumes: []
# -- Identity files: default agent instructions and editor configs copied to /workspace on startup
# -- Files are copied only if they don't already exist (user edits are preserved across restarts)
# -- Set enabled: true to deploy the ConfigMap and init container
identity:
  enabled: false
  files: {}
  # AGENTS.md: |
  #   # Project Identity
  #   This file contains instructions for AI agents working in this workspace.
  #
  # .cursorrules: |
  #   # Cursor Rules
  #   - Always write TypeScript
  #   - Use functional components
  #
  # .clinerules: |
  #   # Cline Rules
  #   - Follow existing code style
   # - Add tests for new features
# -- Container Registry: Local registry for faster development cycles
registry:
  enabled: false
  image:
    repository: registry
    tag: "2.8"
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    username: "registry-user"
    password: "change-me-in-production"
  storage:
    size: 50Gi
    storageClass: ""
  service:
    port: 5000
  tailscale:
    hostname: "registry"
    tags: ["tag:k8s"]
# -- Kubedock: Docker API to Kubernetes Pod translation layer
# -- Prevents OOM kills by running test containers as separate Pods instead of DinD sidecars
kubedock:
  enabled: true
  image:
    repository: joyrex2001/kubedock
    tag: "0.20.3"
    pullPolicy: IfNotPresent
  # -- Port the kubedock API listens on
  port: 2475
  # -- Additional kubedock server arguments
  extraArgs: []
  # - "--port-forward"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # -- Environment variables injected into agent pods when kubedock is enabled
  agentEnv:
    DOCKER_HOST: "tcp://kubedock-service:2475"
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_CHECKS_DISABLE: "true"

# -- Authentik Identity-Aware Proxy configuration
authentik:
  enabled: false
  # -- CRITICAL: Authentik secret key used for encryption. MUST be set to a cryptographically strong random string (at least 32 characters).
  # Generate with: openssl rand -base64 32
  # This value cannot be empty and must be unique per installation.
  secretKey: "change-me-in-production"
  proxy:
    hostname: "opencode.company.com"
  image:
    repository: ghcr.io/goauthentik/server
    tag: "2024.6.1"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  postgres:
    enabled: true
    image:
      repository: postgres
      tag: "15"
    database: "authentik"
    username: "authentik"
    password: "change-me-in-production"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      enabled: true
      size: 10Gi
  redis:
    enabled: true
    image:
      repository: redis
      tag: "7-alpine"
      password: "change-me-in-production"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
  oidc:
    enabled: false
    issuerUrl: ""
    clientSecret: ""
