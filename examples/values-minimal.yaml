# Minimal values to get OpenCode running on k8s
# Copy this file and edit the values, then:
#   helm install opencode ./chart -f my-values.yaml

image:
  repository: ghcr.io/anomalyco/opencode
  tag: "latest"

# At least one provider must be enabled
# GitHub Copilot uses the OpenAI-compatible API — put your Copilot key here
providers:
  openai:
    enabled: true
    apiKey: "your-github-copilot-token-here"

# Required — protects the HTTP endpoint
serverPassword: "your-secure-password"

# Oh-My-OpenCode on with defaults
omo:
  enabled: true

# No MCP servers by default
mcp:
  remote: []
  laptopServers: []

# No Tailscale ingress by default (set enabled: true and install the operator first)
ingress:
  enabled: false

# Plain secrets (for production, use sealed-secrets or external-secrets)
secrets:
  backend: "plain"

# Default storage — adjust storageClass for your cluster
persistence:
  data:
    storageClass: ""
    size: 5Gi
  workspace:
    storageClass: ""
    size: 20Gi
